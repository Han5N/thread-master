name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，不用 setup-android：它内部会装已下架的 "tools" 包而失败
      - name: Install SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT=/usr/local/lib/android/sdk
          fi
          echo "SDK root: $SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "找不到 sdkmanager" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/threadmaster.jks"
            echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/threadmaster.jks") bytes)"
          else
            echo "KEYSTORE_BASE64 未配置，将退回 debug 签名"
          fi

      - name: Build release APK
        env:
          TM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/threadmaster.jks" ]; then
            export TM_KEYSTORE="$RUNNER_TEMP/threadmaster.jks"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          apksigner verify --print-certs "$APK" | head -n 6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadMaster-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
