name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/threadmaster.jks"
            echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/threadmaster.jks") bytes)"
          else
            echo "KEYSTORE_BASE64 未配置，将退回 debug 签名"
          fi

      - name: Build release APK
        env:
          TM_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "$RUNNER_TEMP/threadmaster.jks" ]; then
            export TM_KEYSTORE="$RUNNER_TEMP/threadmaster.jks"
          fi
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          apksigner verify --print-certs "$APK" | head -n 6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadMaster-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
